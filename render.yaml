# =============================================================================
# Render Blueprint Specification for PayBridge AI
# Generated automatically by one-command deployment engine
# =============================================================================

databases:
  - name: paybridge-postgres
    databaseName: paybridge
    user: paybridge
    plan: free
    region: oregon

services:
  # ---------------------------------------------------------------------------
  # 1. Backend Web Service (Go)
  # ---------------------------------------------------------------------------
  - type: web
    name: paybridge-api
    runtime: go
    region: oregon
    plan: free
    rootDir: services/api
    buildCommand: go build -o bin/migrate ./cmd/migrate && go build -o bin/api ./cmd/api
    preDeployCommand: ./bin/migrate -action up
    startCommand: ./bin/migrate -action up && ./bin/api
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paybridge-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        value: sandbox_paybridge_client_id_demo
      - key: PAYPAL_CLIENT_SECRET
        value: sandbox_paybridge_client_secret_demo
      - key: APP_ENV
        value: development
      - key: ALLOW_DEV_AUTH
        value: "true"

  # ---------------------------------------------------------------------------
  # 2. Frontend Static Site (React + Vite)
  # ---------------------------------------------------------------------------
  - type: web
    name: paybridge-web
    runtime: static
    region: oregon
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: paybridge-api
          property: host
